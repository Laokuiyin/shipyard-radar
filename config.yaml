app:
  timezone: Asia/Shanghai
  lookback_days: 365
  request_timeout_seconds: 25
  request_delay_seconds: 1.0
  max_list_pages_per_source: 8
  max_articles_per_run: 300
  user_agent: >-
    Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36
    (KHTML, like Gecko) Chrome/124.0 Safari/537.36 Shipwatch/0.1
  relevance_keywords:
    - 新船
    - 船舶
    - 船东
    - 项目
    - 签约
    - 订单
    - 开工
    - 点火开工
    - 切割
    - 开板
    - 铺龙骨
    - 上船台
    - 出坞
    - 下水
    - 试航
    - 交付
    - 完工
  excluded_keywords:
    - 航空母舰
    - 驱逐舰
    - 护卫舰
    - 潜艇
    - 军舰
    - 入列

