[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shipyard-watch"
version = "0.1.0"
description = "定向采集五家船厂官方新船项目动态并生成 Excel 台账"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.5,<1",
]

[project.scripts]
shipwatch = "shipwatch.cli:main"

[tool.setuptools.packages.find]
include = ["shipwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

