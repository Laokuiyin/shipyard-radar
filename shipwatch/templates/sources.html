{% extends "base.html" %}
{% block content %}
<section class="panel">
  <div class="panel-head"><div><p class="eyebrow">SOURCE LOG</p><h2>来源明细</h2></div><span class="count">最多显示 1000 条</span></div>
  <form class="filters compact" method="get">
    <label>抓取状态<select name="status"><option value="">全部</option>
      {% for item in ['ok','partial','blocked','error'] %}<option value="{{ item }}" {{ 'selected' if status == item else '' }}>{{ item }}</option>{% endfor %}
    </select></label><button type="submit">筛选</button><a class="button secondary" href="/sources">清除</a>
  </form>
  <div class="table-wrap"><table>
    <thead><tr><th>船厂</th><th>渠道</th><th>标题</th><th>发布日期</th><th>抓取状态</th><th>备注</th><th>网址</th></tr></thead>
    <tbody>{% for row in rows %}<tr>
      <td class="yard">{{ row.yard_hint }}</td><td>{{ row.channel }}</td><td>{{ row.title }}</td>
      <td>{{ row.published_at or '—' }}</td><td><span class="badge {{ 'ok' if row.fetch_status == 'ok' else 'review' }}">{{ row.fetch_status }}</span></td>
      <td>{{ row.fetch_error or '—' }}</td><td><a class="source-link" target="_blank" rel="noopener" href="{{ row.url }}">打开</a></td>
    </tr>{% endfor %}</tbody>
  </table></div>
</section>
{% endblock %}
