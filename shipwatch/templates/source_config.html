{% extends "base.html" %}
{% block content %}
<section class="panel">
  <div class="panel-head"><div><p class="eyebrow">SOURCE CONFIG</p><h2>来源配置</h2></div></div>
  <form class="settings-form" method="post" action="/source-config/save">
  <div class="table-wrap"><table>
    <thead><tr><th>启用</th><th>ID</th><th>船厂</th><th>公众号</th></tr></thead>
    <tbody>{% for item in items %}<tr>
      <td><input type="checkbox" name="enabled_{{ item.id }}" value="1" {{ 'checked' if item.enabled }}></td>
      <td class="yard">{{ item.id }}</td>
      <td>{{ item.yard }}</td>
      <td><input type="text" name="accounts_{{ item.id }}" value="{{ item.accounts }}" style="width:100%"></td>
    </tr>{% endfor %}</tbody>
  </table></div>
  <h3 style="padding:18px 22px 8px;font-size:13px;color:#8a9ba6;">自定义来源</h3>
  <div class="table-wrap"><table>
    <thead><tr><th>启用</th><th>ID</th><th>船厂</th><th>公众号</th></tr></thead>
    <tbody>{% for item in custom_items %}<tr>
      <td><input type="checkbox" name="cenabled_{{ item.id }}" value="1" {{ "checked" if item.get("enabled", True) }}></td>
      <td class="yard">{{ item.id }}</td>
      <td>{{ item.yard }}</td>
      <td><input type="text" name="caccounts_{{ item.id }}" value="{{ item.accounts }}" style="width:100%"></td>
    </tr>{% endfor %}<tr>
      <td><input type="checkbox" name="cenabled_new" value="1" checked></td>
      <td class="yard">保存后自动生成</td>
      <td><input type="text" name="new_yard" placeholder="例: 测试船厂" style="width:100%"></td>
      <td><input type="text" name="new_accounts" placeholder="例: 测试号" style="width:100%"></td>
    </tr></tbody>
  </table></div>
  <div class="space-top" style="padding:0 22px 18px;"><button type="submit">保存配置</button></div>
  </form>
</section>
{% endblock %}
